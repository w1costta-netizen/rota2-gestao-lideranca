<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo circular escuro -->
  <circle cx="32" cy="32" r="32" fill="#0D0D0D"/>
  <!-- Aro da bússola -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#E8622A" stroke-width="2.5"/>
  <!-- Marcações cardinais pequenas -->
  <line x1="32" y1="7" x2="32" y2="13" stroke="#E8622A" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="57" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="13" y2="32" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="57" y2="32" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <!-- N -->
  <text x="32" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#E8622A">N</text>
  <!-- Agulha Norte (vermelho/laranja) -->
  <polygon points="32,16 35,33 32,30 29,33" fill="#E8622A"/>
  <!-- Agulha Sul (cinza) -->
  <polygon points="32,48 35,31 32,34 29,31" fill="#555"/>
  <!-- Centro -->
  <circle cx="32" cy="32" r="3" fill="#E8622A"/>
  <circle cx="32" cy="32" r="1.5" fill="#0D0D0D"/>
</svg>
